<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الشهادات لقسم التدريب والتأهيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Amiri:wght@700&family=Tajawal:wght@700&family=Reem+Kufi:wght@700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#1a2038;--mu:#6b7285;--pr:#1c3d8f;--ac:#b8892b;--bd:#dde1ea;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2e;--tx:#e8eaf2;--mu:#98a0b5;--pr:#7ea2ff;--ac:#e0b45a;--bd:#2b3248}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2e;--tx:#e8eaf2;--mu:#98a0b5;--pr:#7ea2ff;--ac:#e0b45a;--bd:#2b3248}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
header{background:var(--pr);color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px}label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:130px}.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:inherit;cursor:pointer;margin-top:10px}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.g{background:var(--ac);color:#1a1200}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.q{border-bottom:1px solid var(--bd);padding:8px 0;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}.q.bad{border-right:3px solid var(--no);padding-right:8px}
.mu{color:var(--mu);font-size:13px}canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:10px}
.q select{margin-top:6px}.msg{color:var(--no);font-size:13px}
</style>
</head>
<body>
<header>منصة الشهادات لقسم التدريب والتأهيل&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;تصميم المبرمجة ايمان عادل جاسم العكيلي / رئيس مبرمجين اقدم اول</header>
<main>

<div class="card"><h3>الشهادات</h3>
 <p class="mu">ارفع ملف المشاركين (صورة أو PDF أو Word). تُقرأ الدورة والتاريخ والأسماء وتُجهَّز الشهادات فوراً في ملف ZIP يحوي PDF لكل مشارك.</p>
 <input type="file" id="pf" accept=".pdf,.docx,.txt">
 <p class="msg" id="pm"></p>
 <div class="row"><div><label>اسم الدورة</label><input id="ccourse"></div><div><label>الفترة</label><input id="cperiod"></div></div>
 <label>المشاركون (اسم في كل سطر)</label><textarea id="ppl"></textarea>
 <div class="row"><div><label>خط الشهادة</label><select id="font"><option value="Arial">Arial</option><option value="Cairo">Cairo (واضح وحديث)</option><option value="Amiri">Amiri (نسخ كلاسيكي)</option><option value="Tajawal">Tajawal (واضح)</option><option value="Reem Kufi">Reem Kufi (كوفي)</option><option value="Aref Ruqaa">Aref Ruqaa (رقعة)</option></select></div><label style="display:flex;align-items:center;gap:8px;margin-top:26px"><input type="checkbox" id="fixa" checked style="width:auto"> تصحيح الهمزات والمسافات تلقائياً</label></div>
 <canvas id="cv"></canvas>
 <div class="row"><button class="btn s" id="one">تحميل الأول PDF</button><button class="btn g" id="all">تحميل كل الشهادات PDF</button></div>
 <p class="mu" id="st"></p>
</div>
</main>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}
async function readFile(f){const n=f.name.toLowerCase();
 if(n.endsWith('.pdf')){const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
  for(let p=1;p<=d.numPages;p++){const c=await(await d.getPage(p)).getTextContent();let y=null,line='';
   for(const it of c.items){const yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){out+=line+'\n';line=''}y=yy;line+=it.str}out+=line+'\n'}return out}
 if(n.endsWith('.docx')){const h=(await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})).value;const d=new DOMParser().parseFromString(h,'text/html');return[...d.querySelectorAll('p,li,td:not(:has(p))')].map(p=>{const t=p.textContent.trim();const b=[...p.querySelectorAll('strong')].reduce((a,s)=>a+s.textContent.length,0);return(t&&b>=t.length*.5?'\u0001':'')+t}).join('\n')}
 if(n.endsWith('.txt'))return await f.text();
 throw new Error('الصيغة غير مدعومة. استخدم PDF أو Word (docx) أو نص.')}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
// ---- participants
const HDR=/اسم|الدورة|المدرب|دائرة|التنفيذ|تنفيذ|قسم|استمارة|وزارة|نتائج|المشارك|التاريخ|معهد|التدريب|المجموع|الدرجة|الملاحظات|ت\b/;
function parseP(text){let course='',period='',names=[];
 for(const raw of text.replace(/\u0001/g,'').split('\n')){const l=norm(raw.trim());if(!l)continue;let m;
  if(/اسم الدورة/.test(l)&&(m=l.split(/[:：]/)[1]))course=m.trim();
  else if(/تاريخ/.test(l)&&(m=l.split(/[:：]/)[1]))period=m.trim();
  else if(!HDR.test(l)&&(m=l.replace(/^[\s\d.\-)(]+|[\s\d.\-)(]+$/g,'').match(/^[\u0600-\u06FF]+(?:\s+[\u0600-\u06FF]+){1,5}$/)))names.push(m[0])}
 return{course,period,names}}
$('pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('pm').textContent='';
 try{const r=parseP(await readFile(f));$('ccourse').value=r.course;$('cperiod').value=r.period;$('ppl').value=r.names.join('\n');if(!r.names.length)$('pm').textContent='لم أجد أسماء. الصور الممسوحة لا تُقرأ هنا، انسخ الأسماء يدوياً.';draw()}catch(x){$('pm').textContent=x.message}};
['ccourse','cperiod','ppl'].forEach(i=>$(i).oninput=draw);
const names=()=>$('ppl').value.split('\n').map(x=>fixName(x)).filter(Boolean);
let img=null;const ti=new Image();ti.onload=()=>{img=ti;draw()};ti.src=TPL;
function fit(c,t,x,y,size,maxw){let s=size;const F='"'+$('font').value+'",Tahoma,"Segoe UI",Arial,sans-serif';c.font='bold '+s+'px '+F;while(c.measureText(t).width>maxw&&s>12){s-=2;c.font='bold '+s+'px '+F}c.fillText(t,x,y)}
function render(cv,name){if(!img)return;const W=img.naturalWidth,H=img.naturalHeight;cv.width=W*2;cv.height=H*2;const c=cv.getContext('2d');c.setTransform(2,0,0,2,0,0);c.imageSmoothingQuality='high';c.drawImage(img,0,0);
 c.direction='rtl';c.textAlign='center';c.fillStyle='#14205a';
 fit(c,name||'اسم المشارك',W*.45,H*.328,H*.075,W*.47);fit(c,fixAr($('ccourse').value),W*.5,H*.596,H*.036,W*.45);fit(c,perFmt($('cperiod').value),W*.5,H*.704,H*.034,W*.55)}
function draw(){render($('cv'),names()[0])}
const tmp=document.createElement('canvas');
function pdf(cv,name){const p=new window.jspdf.jsPDF({orientation:'l',unit:'px',format:[cv.width,cv.height]});p.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,cv.width,cv.height);p.save(name+'.pdf')}
$('one').onclick=()=>{const n=names()[0];if(n){render(tmp,n);pdf(tmp,n)}};
$('all').onclick=async()=>{const ns=names();for(let i=0;i<ns.length;i++){$('st').textContent='جاري إصدار '+(i+1)+' / '+ns.length;render(tmp,ns[i]);pdf(tmp,ns[i]);await new Promise(r=>setTimeout(r,500))}$('st').textContent='تم. إن لم تُحمَّل كلها اسمح بالتحميلات المتعددة في المتصفح'};
const oldP=$('pf').onchange;let SM=null,DL=null;
let ERR='';const INIT=(async()=>{try{if(!window.claude)throw new Error('الخدمة غير متصلة');SM=await claude.use('sample')}catch(e){ERR=e.message||e.code||String(e)}try{DL=await claude.use('downloads')}catch(e){}})();
async function save(name,data){if(DL){try{await DL.save({filename:name,data});return}catch(e){if(e.code==='declined')return}}dl(data instanceof Blob?data:new Blob([data]),name)}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.88)};i.src=URL.createObjectURL(f)})}
async function pdfImgs(f){const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,o=[];for(let p=1;p<=Math.min(d.numPages,6);p++){const pg=await d.getPage(p),v=pg.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;o.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.85)))}return o}
async function prep(f){const n=f.name.toLowerCase();
 if(f.type.startsWith('image/')||/\.(png|jpe?g|webp|heic)$/.test(n))return{imgs:[await shrink(f)],text:''};
 let t=(await readFile(f)).replace(/\u0001([^\n]*)/g,'**$1**');
 if(t.replace(/\s/g,'').length<40&&n.endsWith('.pdf'))return{imgs:await pdfImgs(f),text:''};
 return{imgs:[],text:t.slice(0,200000)}}
async function ask(prompt,p){const lim=await SM.limits().catch(()=>({}));const imgs=lim.images?p.imgs.slice(0,lim.images.maxCount):[];
 if(p.imgs.length&&!imgs.length)throw new Error('قراءة الصور غير متاحة هنا');
 return SM.json(prompt+(p.text?'\n\n--- محتوى الملف ---\n'+p.text:'\n\n(الملف مرفق كصور)'),imgs.length?{images:imgs,modelTier:'default',cache:false}:{modelTier:'default',cache:false})}
const PP='هذا ملف مشاركين في دورة تدريبية. قد يحتوي النص على أخطاء في ترتيب الحروف العربية (مثل "االصطناعي" بدل "الاصطناعي")، صحح اسم الدورة إلى عربية سليمة. استخرج اسم الدورة، والفترة (تاريخ التنفيذ) بنفس صيغة الملف بأرقام عربية مثل ٢٠ - ٢٤ / ٩ / ٢٠٢٦، وأسماء المشاركين كاملة بالترتيب دون أرقام تسلسل. أعد JSON فقط: {"course":"","period":"","names":[""]}';
const HZ={'احمد':'أحمد','ابراهيم':'إبراهيم','اسماعيل':'إسماعيل','ايمان':'إيمان','اسلام':'إسلام','امير':'أمير','انس':'أنس','ايات':'آيات','اسراء':'إسراء','الاء':'آلاء','ايه':'آية','اية':'آية','امينة':'أمينة','اسيل':'أسيل','اسامة':'أسامة','ايهاب':'إيهاب','ادم':'آدم','ابرار':'أبرار','اياد':'إياد'};
function fixAr(t){return(t||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/ی/g,'ي').replace(/ک/g,'ك').replace(/(^|\s)اال(?=[\u0621-\u064A])/g,'$1الا').replace(/\s+/g,' ').trim()}
function fixName(n){n=fixAr(n);if(!$('fixa')||!$('fixa').checked)return n;n=n.replace(/(^|\s)عبد(ال[\u0621-\u064A]+)/g,'$1عبد $2');return n.split(' ').map(w=>HZ[w]||w).join(' ')}
function perFmt(p){p=fixAr(p);return /^[\d٠-٩\s\-–\/.,]+$/.test(p)?'\u2066'+p+'\u2069':p}
const FR=()=>document.fonts?document.fonts.load('700 40px "'+$('font').value+'"','ابجد abc').catch(()=>{}):Promise.resolve();
$('font').onchange=()=>FR().then(draw);$('fixa').onchange=draw;FR().then(draw);if(document.fonts)document.fonts.ready.then(draw);
const mk=cv=>{const p=new window.jspdf.jsPDF({orientation:'l',unit:'px',format:[cv.width,cv.height]});p.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,cv.width,cv.height);return p};
async function zipAll(){await FR();const ns=names(),z=new JSZip();ns.forEach(n=>{render(tmp,n);z.file(n+'.pdf',mk(tmp).output('arraybuffer'))});await save('certificates.zip',await z.generateAsync({type:'blob'}))}
$('all').onclick=async()=>{$('st').textContent='جاري تجهيز الشهادات...';await zipAll();$('st').textContent='تم التجهيز'};
$('one').onclick=async()=>{await FR();const n=names()[0];if(n){render(tmp,n);await save(n+'.pdf',mk(tmp).output('blob'))}};
$('pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!SM)return oldP(e);
 $('pm').style.color='';$('pm').textContent='جاري قراءة الملف...';
 try{const r=await ask(PP,await prep(f));$('ccourse').value=fixAr(r.course);$('cperiod').value=r.period||'';$('ppl').value=(r.names||[]).join('\n');draw();
  if(!(r.names||[]).length){$('pm').textContent='لم أجد أسماء في الملف';return}
  $('pm').textContent='تم استخراج '+r.names.length+' مشارك، جاري تجهيز الشهادات...';await zipAll();$('pm').style.color='#1d8a4e';$('pm').textContent='تم تجهيز الشهادات. راجع الأسماء أعلاه وأعد التنزيل إن عدّلت شيئاً.'}
 catch(x){$('pm').textContent='تعذر القراءة: '+(x.message||x.code)}};
</script>
